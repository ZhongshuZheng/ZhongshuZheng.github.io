site_name: Adam Zheng 的公开笔记
site_description: Adam Zheng 的个人知识库、学习记录与思考。
site_url: https://ZhongshuZheng.github.io/

exclude_docs: |
  blog/
  about.md

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/notes.css

nav:
  - 首页: index.md
  - 公开笔记:
      - 杂项知识:
          - 中世纪盔甲: notes/misc/medieval-armor/index.md

copyright: Copyright &copy; 2026 Adam Zheng
