site_name: Adam Zheng's Notebook
site_description: Adam Zheng 的个人知识库、学习记录与思考。
site_url: https://ZhongshuZheng.github.io/

exclude_docs: |
  blog/
  about.md

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/notes.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页:
      - index.md
      - 计算机:
          - Design Principle: notes/computer/design-principles.md
      - 人工智能:
          - Evolution computation: notes/ai/evolution-computation.md
          - Swarm Intelligence: notes/ai/swarm-intelligence.md
          - Cluster: notes/ai/cluster.md
          - Reinforcement Learning: notes/ai/reinforcement-learning.md
          - "[简介]控制理论": notes/ai/control-theory.md
      - 杂项知识:
          - GDC 论文阅读: notes/misc/gdc-paper-notes.md
          - 中世纪盔甲: notes/misc/medieval-armor.md
          - 乐理: notes/misc/music-theory.md
          - 一些饮料与食物: notes/misc/food-and-drink.md

copyright: Copyright &copy; 2026 Adam Zheng
